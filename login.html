<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
</head>
<body>
  <h2>Entrar no Sistema</h2>
  <input type="text" id="nome" placeholder="Usuário" />
  <input type="password" id="senha" placeholder="Senha" />
  <button type="button" id="btn_entrar">Entrar</button>

  <br /><br />
  <p>Não tem conta? <a href="./cadastro.html">Cadastre-se aqui</a></p>

  <script>
    const api = "http://localhost:3000";
    document.querySelector("#btn_entrar").addEventListener("click", async () => {
      const user = document.querySelector("#nome").value;
      const password = document.querySelector("#senha").value;

      if (!user || !password) {
        return alert("Preencha todos os campos!");
      }

      try {
        const resposta = await fetch(`${api}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, password })
        });

        if (!resposta.ok) {
          return alert("Usuário ou senha incorretos!");
        }

        const usuarioLogado = await resposta.json();
        localStorage.setItem("usuario", JSON.stringify(usuarioLogado));

        if (usuarioLogado.nome === "admin" || user === "admin") {
          window.location.replace("./admin.html");
        } else {
          window.location.replace("./index.html");
        }
      } catch (error) {
        console.error("Erro na requisição:", error);
        alert("Erro ao conectar com o servidor.");
      }
    });
  </script>
</body>
</html>
